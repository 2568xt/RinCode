<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>RinCode</title>
  <link rel="stylesheet" href="./renderer/main.css">
  <style>
    :root {
      --bg-warm: #f7f6f3;
      --text-main: #2b2a27;
      --text-muted: #73726c;
      --border-subtle: #e5e3dc;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg-warm);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    #root {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 12px;
    }
    .loading-title {
      font-size: 16px;
      font-weight: 500;
      color: var(--text-main);
    }
    .loading-desc {
      font-size: 13px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="loading-container">
      <div class="loading-title">RinCode</div>
      <div class="loading-desc">正在加载桌面宿主...</div>
    </div>
  </div>
  <script type="module" src="./renderer/main.js"></script>
</body>
</html>
